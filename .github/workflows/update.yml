name: Update standings

on:
  schedule:
    - cron: "17 * * * *"        # hourly backup; cron-job.org triggers it every 5 min
  workflow_dispatch:            # "Run workflow" button, and the cron-job.org timer
  push:
    branches: [main]
    paths-ignore: ["data.json", "state/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: league-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get the current live standings
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json?t=$(date +%s)" -o /tmp/live.json && mv /tmp/live.json data.json || true

      - name: Pull stats and rebuild standings
        run: node scripts/update.mjs
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}

      - name: Save player matches
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --staged --quiet || (git commit -m "Update player list" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deploy
        uses: actions/deploy-pages@v4
