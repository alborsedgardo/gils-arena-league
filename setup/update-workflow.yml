name: Update standings

on:
  schedule:
    - cron: "17 * * * *"        # every hour at :17
  workflow_dispatch:            # "Run workflow" button for an instant refresh
  push:
    branches: [main]
    paths-ignore: ["data.json", "state/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: league-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull stats and rebuild standings
        run: node scripts/update.mjs
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}

      - name: Save data
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json state
          git diff --staged --quiet || (git commit -m "Update standings" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deploy
        uses: actions/deploy-pages@v4
